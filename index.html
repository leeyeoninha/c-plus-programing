<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ 02장 · 변수와 연산자 — 확인 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10131a;
    --bg-raise: #171b24;
    --bg-card: #1c212c;
    --line: #2a3040;
    --ink: #e7e9ee;
    --ink-dim: #8b93a7;
    --amber: #f2b84b;
    --amber-dim: #7a611f;
    --mint: #7fd8a6;
    --mint-dim: #234433;
    --coral: #e8836e;
    --coral-dim: #472a24;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #1a2130 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height:1.6;
    padding: 0 0 96px;
  }
  a{ color: var(--amber); }

  /* ---------- window chrome ---------- */
  .titlebar{
    display:flex; align-items:center; gap:8px;
    padding: 12px 20px;
    background: var(--bg-raise);
    border-bottom: 1px solid var(--line);
    position: sticky; top:0; z-index: 20;
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#e8836e55; border:1px solid #e8836e; }
  .dot.y{ background:#f2b84b55; border:1px solid #f2b84b; }
  .dot.g{ background:#7fd8a655; border:1px solid #7fd8a6; }
  .filename{
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-dim);
  }
  .score-pill{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-dim);
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 5px 12px;
    border-radius: 100px;
  }
  .score-pill.done{ color: var(--mint); border-color: var(--mint-dim); }

  /* ---------- header / hero ---------- */
  header.hero{
    max-width: 760px; margin: 0 auto;
    padding: 56px 24px 40px;
  }
  .eyebrow-line{
    font-family: var(--mono); font-size: 13px; color: var(--amber);
    margin: 0 0 14px;
  }
  header.hero h1{
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.25;
    margin: 0 0 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.hero p{
    color: var(--ink-dim);
    font-size: 16px;
    max-width: 58ch;
    margin: 0;
  }

  main{ max-width: 760px; margin: 0 auto; padding: 0 24px; }

  section.block{ margin: 48px 0; }
  .block-head{
    display:flex; align-items:baseline; gap: 10px;
    margin-bottom: 22px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .block-head .idx{
    font-family: var(--mono); color: var(--amber); font-size: 14px;
  }
  .block-head h2{ font-size: 20px; margin:0; font-weight: 700; }

  /* ---------- quiz card ---------- */
  .qcard{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 22px 20px;
    margin-bottom: 16px;
    transition: border-color .2s ease;
  }
  .qcard .qtag{
    font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
    margin-bottom: 10px;
  }
  .qcard p.prompt{
    margin: 0 0 16px;
    font-size: 15.5px;
    white-space: pre-wrap;
  }
  .prompt code, pre.snippet{
    font-family: var(--mono);
    font-size: 13.5px;
  }
  pre.snippet{
    background: #0d0f15;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x:auto;
    margin: 10px 0 16px;
    color: #cdd3e0;
  }
  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    display:flex; align-items:flex-start; gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14.5px;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover{ border-color: #3a4257; background: #20263300; }
  .opt input{ margin-top: 3px; accent-color: var(--amber); }
  .qcard.correct{ border-color: var(--mint-dim); background: linear-gradient(180deg, #16241c 0%, var(--bg-card) 60px); }
  .qcard.incorrect{ border-color: var(--coral-dim); background: linear-gradient(180deg, #241a18 0%, var(--bg-card) 60px); }
  .opt.mark-correct{ border-color: var(--mint); background: #16281f; }
  .opt.mark-wrong{ border-color: var(--coral); background: #2a1a17; }
  .feedback{
    display:none;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 14px; color: var(--ink-dim);
  }
  .feedback .verdict{
    font-family: var(--mono); font-weight:700; font-size: 13px;
    display:inline-block; margin-bottom: 6px;
  }
  .qcard.correct .feedback .verdict{ color: var(--mint); }
  .qcard.incorrect .feedback .verdict{ color: var(--coral); }
  .qcard.graded .feedback{ display:block; }
  .qcard.graded .opt{ pointer-events: none; }

  /* ---------- submit / summary ---------- */
  .grade-bar{
    display:flex; justify-content:center; margin: 32px 0 8px;
  }
  #gradeBtn{
    font-family: var(--mono); font-size: 14px; font-weight:700;
    color: #10131a; background: var(--amber);
    border:none; padding: 13px 28px; border-radius: 8px;
    cursor:pointer;
    box-shadow: 0 0 0 1px var(--amber-dim);
  }
  #gradeBtn:hover{ filter: brightness(1.07); }
  #gradeBtn:disabled{ opacity:.5; cursor:not-allowed; }
  .summary{
    display:none;
    text-align:center; font-family: var(--mono);
    color: var(--ink-dim); font-size: 13px; margin-top: 10px;
  }

  /* ---------- debug problems ---------- */
  .dcard{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .dcard .dtag{
    font-family: var(--mono); font-size: 12px; color: var(--coral); margin-bottom: 10px;
  }
  .dcard p.desc{ margin: 0 0 14px; color: var(--ink-dim); font-size: 14.5px; }
  .linehl{ background:#472a2455; border-left: 2px solid var(--coral); display:block; margin: 0 -16px; padding: 0 16px 0 14px; }
  details.reveal{
    margin-top: 14px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  details.reveal summary{
    cursor:pointer;
    font-family: var(--mono); font-size: 13px; color: var(--amber);
    list-style: none;
  }
  details.reveal summary::-webkit-details-marker{ display:none; }
  details.reveal summary::before{ content: "▸ "; }
  details.reveal[open] summary::before{ content: "▾ "; }
  details.reveal .answer{
    margin-top: 12px; font-size: 14.5px; color: var(--ink);
  }
  details.reveal .answer code{
    font-family: var(--mono); background:#0d0f15; padding: 2px 6px; border-radius:4px; font-size: 13px;
  }

  footer{
    max-width: 760px; margin: 40px auto 0; padding: 24px;
    color: var(--ink-dim); font-size: 13px;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<div class="titlebar">
  <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
  <span class="filename">chapter02_review.cpp</span>
  <span class="score-pill" id="scorePill">0 / 8 채점됨</span>
</div>

<header class="hero">
  <p class="eyebrow-line">// Do it! C++ &nbsp;·&nbsp; 첫째마당 02장</p>
  <h1>변수와 연산자 확인 학습</h1>
  <p>표준 입출력, 데이터 형식, 변수의 유효 범위, 형 변환, 연산자까지 — 앞에서 배운 내용을 퀴즈와 디버깅 문제로 점검해 보세요.</p>
</header>

<main>
  <section class="block" id="quiz-block">
    <div class="block-head">
      <span class="idx">01</span>
      <h2>이해도 점검 퀴즈</h2>
    </div>
    <div id="quizList"></div>
    <div class="grade-bar"><button id="gradeBtn">채점하기</button></div>
    <p class="summary" id="summary"></p>
  </section>

  <section class="block" id="debug-block">
    <div class="block-head">
      <span class="idx">02</span>
      <h2>코드 오류 찾기</h2>
    </div>
    <div id="debugList"></div>
  </section>
</main>

<footer>
  이지스퍼블리싱 「Do it! C++」 첫째마당 02장(변수와 연산자) 학습 확인용 자료입니다.
</footer>

<script>
const questions = [
  {
    prompt: "다음 중 C++ 표준 입출력에 대한 설명으로 옳지 않은 것은?",
    options: [
      "cin은 iostream에 정의된 입력 스트림 객체이다",
      "cout << 값1 << 값2; 형태로 여러 값을 한 번에 출력할 수 있다",
      "C++에서는 C 언어의 scanf, printf를 전혀 사용할 수 없다",
      "using namespace std;를 사용하면 std:: 를 생략할 수 있다"
    ],
    correct: 2,
    explanation: "C++ 언어에서도 C 언어에서 제공하는 scanf, printf를 그대로 사용할 수 있습니다. 다만 C++ 표준 입출력 방식은 iostream의 cin, cout을 사용합니다."
  },
  {
    prompt: "다음 코드의 실행 결과는 무엇인가요?",
    code: "int a = 0, b = 0;\nint a_prefix = ++a;\nint b_postfix = b++;\ncout << a_prefix << \" \" << b_postfix;",
    options: ["1 1", "1 0", "0 1", "0 0"],
    correct: 1,
    explanation: "전위 증가(++a)는 먼저 값을 1 증가시킨 후 대입하므로 a_prefix는 1입니다. 후위 증가(b++)는 먼저 현재 값을 대입한 후 증가시키므로 b_postfix는 0(증가 전 값)입니다."
  },
  {
    prompt: "int a = 12; (2진수 1100), int b = 10; (2진수 1010)일 때, int c = a & b; 의 결과값(10진수)은?",
    options: ["8", "14", "6", "22"],
    correct: 0,
    explanation: "1100 & 1010 = 1000이며, 이는 10진수로 8입니다. AND 연산은 같은 자리 비트가 둘 다 1일 때만 결과가 1이 됩니다."
  },
  {
    prompt: "다음 코드의 출력 결과는?",
    code: "int value = 1; // 전역 변수\nint main() {\n  int value = -1; // 지역 변수\n  cout << value << endl;\n  cout << ::value << endl;\n}",
    options: ["1\\n1", "-1\\n-1", "-1\\n1", "1\\n-1"],
    correct: 2,
    explanation: "지역 변수 value는 -1로 지역 범위에서 우선 적용되어 그대로 -1이 출력됩니다. ::value는 범위 지정 연산자로 전역 변수를 가리키므로 1이 출력됩니다."
  },
  {
    prompt: "int a = 10, b = 5, c = 8;\nint result = a + b * c;\n결과값은 얼마인가요? (연산자 우선순위 고려)",
    options: ["120", "50", "58", "18"],
    correct: 1,
    explanation: "곱셈(*)이 덧셈(+)보다 우선순위가 높으므로 b * c = 40이 먼저 계산되고, a + 40 = 50이 됩니다."
  },
  {
    prompt: "다음 중 암시적 형 변환에서 데이터 유실이 발생하는 경우는?",
    options: ["char → int", "int → float", "double → int", "short → long"],
    correct: 2,
    explanation: "double(8byte, 소수 포함)에서 int(4byte, 정수만)로 변환하면 소수점 이하 값이 사라지고 표현 범위도 줄어들어 데이터 유실이 발생합니다. 나머지는 작은 범위에서 큰 범위로 가는 '숫자 승격'이라 데이터가 유지됩니다."
  },
  {
    prompt: "다음 중 식별자(변수명 등)로 사용할 수 없는 것은?",
    options: ["_myValue", "nValue", "class", "value1"],
    correct: 2,
    explanation: "class는 C++의 키워드(예약어)이므로 식별자로 사용할 수 없습니다. 식별자는 숫자로 시작할 수 없고, 문자 또는 밑줄로 시작해야 합니다."
  },
  {
    prompt: "int a = 7, b = 5;\nint result = a > b ? a : b;\nresult의 값은?",
    options: ["7", "5", "true", "컴파일 오류"],
    correct: 0,
    explanation: "a > b (7 > 5)는 참(true)이므로 삼항 연산자는 a값인 7을 반환합니다. 삼항 연산자는 if~else 구문을 한 줄로 축약한 것입니다."
  }
];

const debugProblems = [
  {
    title: "문제 1 · 컴파일 오류 찾기",
    desc: "이 코드는 컴파일되지 않습니다. 원인을 찾아보세요.",
    code: [
      "#include <iostream>",
      "using namespace std;",
      "",
      "int main() {",
      "    int value;",
      "    class = 10;", // highlight
      "    cout << value << endl;",
      "    return 0;",
      "}"
    ],
    highlight: 5,
    answer: "<code>class</code>는 C++의 키워드(예약어)이기 때문에 변수 이름으로 사용할 수 없습니다. 식별자는 키워드와 겹치지 않는 이름이어야 하며, <code>class</code> 대신 <code>value = 10;</code>처럼 실제로 선언한 변수 이름을 사용해야 합니다."
  },
  {
    title: "문제 2 · 데이터 유실 경고 찾기",
    desc: "두 줄 모두 컴파일은 되지만, 어떤 문제가 있을까요? 의도적인 변환임을 명시하려면 어떻게 고쳐야 할까요?",
    code: [
      "#include <iostream>",
      "using namespace std;",
      "",
      "int main() {",
      "    double pi = 3.14159265358979;",
      "    int int_pi = pi;", // highlight 1
      "    float f = 3.14159265358979;", // highlight 2
      "    cout << int_pi << \" \" << f << endl;",
      "    return 0;",
      "}"
    ],
    highlight: [5, 6],
    answer: "두 줄 모두 double → int, double → float으로 가는 <b>암시적 형 변환</b>이며, 큰 범위 형식을 작은 범위 형식으로 변환하므로 <b>데이터 유실</b>이 발생합니다(int_pi는 소수점 이하가 잘려 3, f는 유효 자릿수가 줄어듭니다). 의도적인 변환임을 드러내려면 명시적 형 변환을 사용합니다: <code>int int_pi = int(pi);</code>, <code>float f = float(3.14159265358979);</code> 또는 리터럴에 <code>f</code> 접미사를 붙여 <code>3.14159265358979f</code>로 작성합니다."
  },
  {
    title: "문제 3 · 실행 결과 예측하기",
    desc: "a, b, c에 최종적으로 어떤 값이 들어갈지 순서대로 따라가 보세요.",
    code: [
      "#include <iostream>",
      "using namespace std;",
      "",
      "int main() {",
      "    int a = 5;",
      "    int b = a++;",
      "    int c = ++a;",
      "    cout << \"a=\" << a << \" b=\" << b << \" c=\" << c << endl;",
      "    return 0;",
      "}"
    ],
    highlight: null,
    answer: "① <code>int b = a++;</code> → 후위 증가이므로 b에는 증가 전 값 5가 대입되고, a는 그 후 6이 됩니다. ② <code>int c = ++a;</code> → 전위 증가이므로 a가 먼저 7로 증가한 뒤 c에 7이 대입됩니다. 최종 출력: <code>a=7 b=5 c=7</code>"
  },
  {
    title: "문제 4 · 시프트 연산 오류 찾기",
    desc: "④, ⑤는 왜 '정의되지 않은 동작(undefined behavior)'이 되는지 설명해보세요.",
    code: [
      "int a = 13;",
      "int d = a >> -1;   // ④",
      "int e = a << 32;   // ⑤"
    ],
    highlight: [1, 2],
    answer: "시프트 연산자는 이동할 비트 수가 <b>음수이거나</b>, <b>피연산자의 비트 폭 이상</b>이면 결과가 정의되지 않습니다. ④는 이동 비트 수가 -1로 음수이고, ⑤는 int가 보통 32비트인데 32비트만큼 이동하려 해 전체 비트를 벗어납니다. 두 경우 모두 컴파일러가 warning C4293과 같은 경고를 출력하며, 실행 결과는 컴파일러/플랫폼마다 달라질 수 있으므로 실무 코드에서는 피해야 합니다."
  }
];

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---- render quiz ----
const quizList = document.getElementById('quizList');
questions.forEach((q, i) => {
  const card = document.createElement('div');
  card.className = 'qcard';
  card.dataset.index = i;

  let html = `<div class="qtag">Q${i+1}</div>`;
  if (q.code) {
    html += `<pre class="snippet">${escapeHtml(q.code)}</pre>`;
    html += `<p class="prompt">${escapeHtml(q.prompt)}</p>`;
  } else {
    html += `<p class="prompt">${escapeHtml(q.prompt)}</p>`;
  }
  html += `<div class="options">`;
  q.options.forEach((opt, j) => {
    html += `
      <label class="opt" data-opt="${j}">
        <input type="radio" name="q${i}" value="${j}">
        <span>${escapeHtml(opt)}</span>
      </label>`;
  });
  html += `</div>`;
  html += `<div class="feedback"><span class="verdict"></span><div class="exp"></div></div>`;

  card.innerHTML = html;
  quizList.appendChild(card);
});

document.getElementById('gradeBtn').addEventListener('click', () => {
  let score = 0;
  let allAnswered = true;

  questions.forEach((q, i) => {
    const card = quizList.children[i];
    const selected = card.querySelector(`input[name="q${i}"]:checked`);
    if (!selected) { allAnswered = false; return; }

    const chosen = parseInt(selected.value, 10);
    const isCorrect = chosen === q.correct;
    if (isCorrect) score++;

    card.classList.add('graded');
    card.classList.add(isCorrect ? 'correct' : 'incorrect');

    card.querySelectorAll('.opt').forEach((optEl) => {
      const j = parseInt(optEl.dataset.opt, 10);
      if (j === q.correct) optEl.classList.add('mark-correct');
      else if (j === chosen) optEl.classList.add('mark-wrong');
    });

    const fb = card.querySelector('.feedback');
    fb.querySelector('.verdict').textContent = isCorrect ? '정답' : '오답';
    fb.querySelector('.exp').textContent = q.explanation;
  });

  if (!allAnswered) {
    alert('모든 문항에 답한 후 채점해 주세요.');
    return;
  }

  document.getElementById('scorePill').textContent = `${score} / ${questions.length} 채점됨`;
  document.getElementById('scorePill').classList.add('done');
  document.getElementById('gradeBtn').disabled = true;
  document.getElementById('gradeBtn').textContent = '채점 완료';

  const summary = document.getElementById('summary');
  summary.style.display = 'block';
  summary.textContent = `// ${score} / ${questions.length} passed`;
});

// ---- render debug problems ----
const debugList = document.getElementById('debugList');
debugProblems.forEach((p) => {
  const card = document.createElement('div');
  card.className = 'dcard';

  const highlightSet = new Set(Array.isArray(p.highlight) ? p.highlight : (p.highlight !== null ? [p.highlight] : []));
  const codeLines = p.code.map((line, idx) => {
    const escaped = escapeHtml(line);
    return highlightSet.has(idx) ? `<span class="linehl">${escaped}</span>` : escaped;
  }).join('\n');

  card.innerHTML = `
    <div class="dtag">${escapeHtml(p.title)}</div>
    <p class="desc">${escapeHtml(p.desc)}</p>
    <pre class="snippet">${codeLines}</pre>
    <details class="reveal">
      <summary>정답 및 해설 보기</summary>
      <div class="answer">${p.answer}</div>
    </details>
  `;
  debugList.appendChild(card);
});
</script>

</body>
</html>
